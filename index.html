<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamplight · Pomodoro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Josefin+Sans:wght@600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --wall1:#fbd9b4;--wall2:#f2a97c;--sky1:#f7c58f;--sky2:#fde9c9;--desk:#7a4a35;--desk2:#5e3626;
  --ink:#4a2338;--soft:#7d5568;--glow:rgba(255,196,110,.55);--panel:rgba(255,240,222,.55);
  --focus:#b4492f;--short:#4f7a52;--long:#6c4f96;--btn-ink:#fff6ea;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall1:#2b1a2a;--wall2:#4a2a32;--sky1:#1a1530;--sky2:#3a2a52;--desk:#4a2c25;--desk2:#33201c;
    --ink:#fbe6cf;--soft:#d2b19c;--glow:rgba(255,180,90,.42);--panel:rgba(30,18,28,.5);
    --focus:#f2b25c;--short:#a9c796;--long:#c7b0e0;--btn-ink:#2b1a2a;
  }
}
:root[data-theme="dark"]{
  --wall1:#2b1a2a;--wall2:#4a2a32;--sky1:#1a1530;--sky2:#3a2a52;--desk:#4a2c25;--desk2:#33201c;
  --ink:#fbe6cf;--soft:#d2b19c;--glow:rgba(255,180,90,.42);--panel:rgba(30,18,28,.5);
  --focus:#f2b25c;--short:#a9c796;--long:#c7b0e0;--btn-ink:#2b1a2a;
}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--wall1),var(--wall2));overflow:hidden;
  --ring:var(--focus)}
body[data-phase="short"]{--ring:var(--short)}
body[data-phase="long"]{--ring:var(--long)}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1rem 1rem calc(var(--cat)*.85);box-sizing:border-box;text-align:center}
h1{font:400 1.05rem var(--sans);font-weight:600;margin:0;color:var(--soft);letter-spacing:.02em}
#phase{font:700 clamp(2rem,6vw,2.7rem) var(--serif);margin:0;color:var(--ring);transition:color .6s}
.dial{position:relative;width:min(78vw,340px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle,var(--panel) 62%,transparent 63%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 90px 10px var(--glow)}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:7;stroke-linecap:round}
.track{stroke:var(--soft);opacity:.25}
#arc{stroke:var(--ring);transition:stroke .6s,stroke-dashoffset .4s linear}
#time{font:700 clamp(3.4rem,14vw,5.2rem) var(--serif);font-variant-numeric:lining-nums tabular-nums;line-height:1}
#hint{margin:.5rem 0 0;font-size:.95rem;color:var(--soft);max-width:15rem;min-height:2.6em}
.dial div{display:flex;flex-direction:column;align-items:center}
#dots{display:flex;gap:.6rem}
#dots i{width:.8rem;height:.8rem;border-radius:50%;border:2px solid var(--ring);transition:background .3s}
#dots i.done{background:var(--ring)}
#dots i.now{box-shadow:0 0 0 4px var(--glow)}
#count{margin:0;font-size:.9rem;color:var(--soft)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
button{font:600 1rem "Josefin Sans",var(--sans);letter-spacing:.03em;cursor:pointer;border:2px solid var(--ring);color:var(--ink);background:transparent;padding:.7rem 1.2rem;border-radius:999px;transition:background .2s,color .2s}
button:hover{background:var(--panel)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.main{background:var(--ring);color:var(--btn-ink);min-width:8.5rem}
button.main:hover{filter:brightness(1.08);background:var(--ring)}
.corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + .8rem);right:.8rem;z-index:2;display:flex;gap:.5rem}
.corner button{padding:.45rem .8rem;font-size:.85rem;border-color:var(--soft)}
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 1rem);transform:translate(-50%,-160%);z-index:3;background:var(--ring);color:var(--btn-ink);padding:.7rem 1.2rem;border-radius:999px;font-weight:600;transition:transform .4s}
#banner.show{transform:translate(-50%,0)}
:root{--cat:clamp(170px,min(34vh,46vw),340px)}
.cat{position:fixed;left:max(.5rem,3vw);bottom:1.2vh;width:var(--cat);z-index:1;pointer-events:none}
.cat.jump{animation:jump .9s ease-out}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-3deg)}60%{transform:translateY(0)}78%{transform:translateY(-9px)}100%{transform:translateY(0)}}
.bubble{position:relative;display:inline-block;margin:0 0 .7rem .2rem;background:#fff3e0;color:#4a2338;font:400 1.1rem/1.2 "Patrick Hand","Comic Sans MS",cursive;padding:.4rem .7rem;border-radius:12px}
.bubble::after{content:"";position:absolute;left:20px;bottom:-6px;border:7px solid transparent;border-top-color:#fff3e0;border-bottom:0}
.frame{position:relative;aspect-ratio:4/3;border:5px solid #fff3e0;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 44px var(--glow);transform:rotate(-3deg);animation:bob 3.4s ease-in-out infinite;transition:transform 1s}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#catA{display:block}
@keyframes bob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-3px)}}
@keyframes hop{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-10px)}}
body[data-phase="short"] #catA{display:none}
body[data-phase="short"] #catB{display:block}
body[data-phase="short"] .frame{animation:hop 1.1s ease-in-out infinite}
body[data-phase="long"] .frame{animation:none;transform:rotate(-10deg) translateY(8px)}
body[data-phase="long"] #catA{filter:brightness(.5) saturate(.6)}
.zz{display:none;position:absolute;top:4px;right:8px;font:700 1.2rem Georgia,serif;color:#fff;animation:zzf 2.4s ease-in infinite}
body[data-phase="long"] .zz{display:block}
@keyframes zzf{0%{opacity:0;transform:translate(0,8px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@media (prefers-reduced-motion:reduce){.frame,.cat.jump,.zz{animation:none}}
.drawer{position:fixed;z-index:4;top:0;right:0;bottom:0;width:min(92vw,380px);box-sizing:border-box;background:var(--wall1);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 1rem) 1.1rem calc(env(safe-area-inset-bottom,0px) + 1rem);overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.4)}
.drawer[hidden]{display:none}
.dhead{display:flex;justify-content:space-between;align-items:center}
.drawer h2{font:700 1.8rem var(--serif);margin:0}
.drawer h3{font:600 .8rem var(--sans);color:var(--soft);margin:1.3rem 0 .5rem;text-transform:uppercase;letter-spacing:.06em}
.drawer button{padding:.4rem .9rem;font-size:.85rem;border-color:var(--soft)}
#acct{font-size:.85rem;color:var(--soft);margin:.6rem 0 1rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.tiles>div{background:var(--panel);border-radius:12px;padding:.7rem .3rem;text-align:center;font-size:.75rem;color:var(--soft)}
.tiles b{display:block;font:700 2.3rem var(--serif);font-variant-numeric:lining-nums;color:var(--ring)}
.tiles span{display:block}
#bars{display:flex;gap:.4rem;align-items:flex-end;height:130px}
#bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.2rem;font-size:.68rem;color:var(--soft)}
#bars i{width:100%;background:var(--ring);border-radius:6px 6px 0 0;display:block}
#hours{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
#hours i{height:30px;background:var(--ring);border-radius:3px}
.hl{display:flex;justify-content:space-between;font-size:.7rem;color:var(--soft);margin-top:.3rem}
#best{font-weight:600;margin:.7rem 0 0}
.corner{flex-wrap:wrap;justify-content:flex-end;max-width:92vw}

const $=id=>document.getElementById(id);
const arc=$('arc');arc.style.strokeDasharray=C;
const dots=$('dots');for(let i=0;i<CFG.sessions;i++)dots.appendChild(document.createElement('i'));
const dur=p=>CFG[p]*60;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function render(){
  document.body.dataset.phase=phase;
  $('phase').textContent=NAMES[phase];
  $('time').textContent=fmt(remaining);
  arc.style.strokeDashoffset=C*(1-remaining/dur(phase));
  const done=phase==='focus'?session-1:phase==='short'?session:CFG.sessions;
  [...dots.children].forEach((d,i)=>{d.className=i<done?'done':(phase==='focus'&&i===session-1?'now':'')});
  $('count').textContent=phase==='long'?'All '+CFG.sessions+' sessions done':'Session '+session+' of '+CFG.sessions;
  $('go').textContent=running?'Pause':(remaining<dur(phase)?'Resume':'Start');
  document.title=fmt(remaining)+' · '+NAMES[phase];
}
const SAYS={focus:['Shh… I’m calculating.','Is this on the syllabus?','Pencil ready. Brain loading.'],short:['Snack time?!','I did the thing! Treats?','Break! Tell everyone!'],long:['Wake me in 30.','Dreaming of an A+.']};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function setHint(){$('hint').textContent=pick(HINTS[phase]);$('bubble').textContent=pick(SAYS[phase])}
function advance(){
  if(phase==='focus'){phase=session>=CFG.sessions?'long':'short'}
  else{if(phase==='long')session=1;else session++;phase='focus'}
  remaining=dur(phase);setHint();
}
function loop(){
  remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  if(remaining===0){
    const was=phase;if(was==='focus')logSession();advance();alarm();startle();
    banner(was==='focus'?'Session done. '+NAMES[phase]+' started.':'Break over. Back to focus.');
    endAt=Date.now()+remaining*1000;
  }
  render();
}
function start(){unlock();endAt=Date.now()+remaining*1000;running=true;clearInterval(timer);timer=setInterval(loop,250);render()}
function pause(){running=false;clearInterval(timer);render()}
$('go').onclick=()=>running?pause():start();
$('skip').onclick=()=>{advance();if(running)endAt=Date.now()+remaining*1000;render()};
$('reset').onclick=()=>{pause();phase='focus';session=1;remaining=dur('focus');setHint();render()};

function startle(){const c=$('cat');c.classList.remove('jump');void c.offsetWidth;c.classList.add('jump')}
// Alarm: soft chime made with the Web Audio API (no audio files needed).
function unlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function alarm(){
  if(muted||!actx)return;
  const t0=actx.currentTime;
  for(let r=0;r<3;r++)[784,988,1175].forEach((f,i)=>{
    const t=t0+r*1.1+i*.18,o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.9);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+1);
  });
}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'Sound off':'Sound on';$('mute').setAttribute('aria-pressed',muted)};
$('theme').onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};
let bt;function banner(m){const b=$('banner');b.textContent=m;b.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('show'),5000)}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();running?pause():start()}});
// ---- Study stats: saved to your account when signed in, and always on this device ----
const KEY='lamp-days';let days={},col=null;
try{days=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const dkey=d=>d.toLocaleDateString('en-CA');
const hm=m=>m<60?m+'m':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const h12=i=>(i%12||12)+(i%24<12?' AM':' PM');
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(days))}catch(e){}}
function logSession(){
  const now=new Date(),st=new Date(now-CFG.focus*60000),k=dkey(now);
  const d=days[k]||{date:k,p:0,m:0,h:Array(24).fill(0)};
  d.p++;d.m+=CFG.focus;d.h[st.getHours()]+=CFG.focus;days[k]=d;saveLocal();renderStats();
  if(col)col.doc(k).set(d).catch(()=>{});
}
function tile(id,label,x){$(id).innerHTML='<b>'+x.p+'</b><span>pomodoros</span><span>'+hm(x.m)+'</span><span>'+label+'</span>'}
function renderStats(){
  const today=new Date(),sum=a=>a.reduce((t,d)=>({p:t.p+d.p,m:t.m+d.m}),{p:0,m:0});
  const last=[...Array(7)].map((_,i)=>{const d=new Date(today);d.setDate(d.getDate()-(6-i));return{d,v:days[dkey(d)]||{p:0,m:0}}});
  tile('tToday','today',days[dkey(today)]||{p:0,m:0});tile('tWeek','last 7 days',sum(last.map(x=>x.v)));tile('tAll','all time',sum(Object.values(days)));
  const mx=Math.max(1,...last.map(x=>x.v.m));
  $('bars').innerHTML=last.map(x=>'<div><span>'+(x.v.m?hm(x.v.m):'')+'</span><i style="height:'+Math.max(3,x.v.m/mx*90)+'px"></i><span>'+x.d.toLocaleDateString('en',{weekday:'short'})+'</span></div>').join('');
  const hr=Array(24).fill(0);Object.values(days).forEach(d=>(d.h||[]).forEach((v,i)=>{hr[i]+=v||0}));
  const mh=Math.max(...hr),bi=hr.indexOf(mh);
  $('hours').innerHTML=hr.map((v,i)=>'<i title="'+h12(i)+': '+hm(v)+'" style="opacity:'+(v?(.2+.8*v/mh):.08)+'"></i>').join('');
  $('best').textContent=mh?'You focus most around '+h12(bi)+' to '+h12((bi+1)%24)+'.':'Finish a pomodoro to see when you study best.';
}
function setAcct(cloud){$('acct').textContent=cloud?'Signed in with your claude.ai account. Your stats are private to you and saved online.':'Not signed in here, so stats are saved on this device only.'}
$('statsBtn').onclick=()=>{renderStats();$('stats').hidden=false};
$('sclose').onclick=()=>{$('stats').hidden=true};
setAcct(false);renderStats();
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const [db,u]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!u)return;
  col=db.collection('data/users/'+await u.id());
  col.onSnapshot(sn=>{const r={};sn.docs.forEach(x=>{r[x.id]=x.data()});
    Object.keys(days).forEach(k=>{if(!r[k])col.doc(k).set(days[k]).catch(()=>{})});
    Object.assign(days,r);saveLocal();renderStats();setAcct(true)},()=>setAcct(false));
}catch(e){}})();
// Your own background photo (resized and kept in this browser only)
function setPhoto(u){const ph=$('photo');ph.style.backgroundImage=u?'linear-gradient(rgba(50,25,20,.3),rgba(50,25,20,.5)),url("'+u+'")':'';$('bgreset').hidden=!u}
$('bgpick').onclick=()=>$('bgfile').click();
$('bgreset').onclick=()=>{setPhoto('');try{localStorage.removeItem('lamp-bg')}catch(e){}};
$('bgfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.82);setPhoto(u);try{localStorage.setItem('lamp-bg',u)}catch(e){}};img.src=rd.result};rd.readAsDataURL(f);e.target.value=''};
try{const u=localStorage.getItem('lamp-bg');if(u)setPhoto(u)}catch(e){}
setHint();render();
</script>
</body>
</html>
